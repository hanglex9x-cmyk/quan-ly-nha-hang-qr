          '<div class="field"><label>Địa chỉ</label><input id="sAddr" value="' + esc(SHOP.address) + '" placeholder="Ví dụ: 128 Nguyễn Trãi, Q.1, TP.HCM"></div>' +
          '<div class="field"><label>Số điện thoại</label><input id="sPhone" value="' + esc(SHOP.phone) + '" placeholder="Ví dụ: 0909 242 424"></div>' +
          '<div class="field"><label>Logo nhà hàng</label>' +
            '<div class="img-pick" id="sLogoPick">' +
              '<span id="sLogoSlot" style="display:contents"></span>' +
              '<div class="img-pick-body">' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-ghost btn-sm" id="sLogoBtn">' + IC.upload.replace('class="ic"','width="16" height="16"') + ' Tải logo từ máy</button>' +
                '<button type="button" class="btn btn-ghost btn-sm' + (pendingLogo ? '' : ' hidden') + '" id="sLogoDel" style="color:var(--red)">Xóa logo</button></div>' +
                '<input id="sLogoFile" type="file" accept="image/*" class="hidden">' +
                '<div class="img-hint">Logo hiện ở menu chính phía nhân viên, đầu trang phía khách, trên hóa đơn thanh toán và thẻ QR in dán bàn. Ảnh PNG nền trong suốt hiển thị đẹp nhất — kéo thả file ảnh vào khung này cũng được.</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:4px"><button class="btn btn-brand" id="sSave">Lưu & áp dụng ngay</button><button class="btn btn-ghost" id="sReset">Khôi phục thông tin mẫu</button></div>' +
          '<p style="font-size:12.5px;color:var(--muted);margin:12px 0 0">Thông tin này áp dụng ngay lên mọi nơi đang hiện tên quán: menu chính, đầu trang phía khách, hóa đơn, phiếu in POS, file hóa đơn .txt và thẻ QR bàn. Bản demo tải lại trang là quay về thông tin mẫu — bản chính thức nối Sheet của quán sẽ lưu bền.</p>' +
        '</div>';
      const fileIn = $('#sLogoFile'), pick = $('#sLogoPick'), slot = $('#sLogoSlot');
      const syncLogo = () => {
        slot.innerHTML = pendingLogo
          ? '<img class="logo-prev" src="' + pendingLogo + '" alt="Xem trước logo nhà hàng">'
          : '<div class="logo-ph">Chưa có logo</div>';
        $('#sLogoDel').classList.toggle('hidden', !pendingLogo);
      };
      syncLogo();
      $('#sLogoBtn').addEventListener('click', () => fileIn.click());
      fileIn.addEventListener('change', () => {
        const f = fileIn.files && fileIn.files[0];
        if(f) readDishImage(f, d => { pendingLogo = d; syncLogo(); toast('Đã tải logo lên — bấm Lưu & áp dụng ngay để dùng'); });
        fileIn.value = '';
      });
      $('#sLogoDel').addEventListener('click', () => { pendingLogo = ''; syncLogo(); });
      ['dragover','dragenter'].forEach(ev => pick.addEventListener(ev, e => { e.preventDefault(); pick.classList.add('drag'); }));
      ['dragleave','drop'].forEach(ev => pick.addEventListener(ev, e => { e.preventDefault(); pick.classList.remove('drag'); }));
      pick.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) readDishImage(f, d => { pendingLogo = d; syncLogo(); toast('Đã tải logo lên — bấm Lưu & áp dụng ngay để dùng'); }); });
      $('#sSave').addEventListener('click', () => {
        const name = $('#sName').value.trim();
        if(!name){ toast('Nhập tên nhà hàng', true); return; }
        SHOP.name = name; SHOP.address = $('#sAddr').value.trim(); SHOP.phone = $('#sPhone').value.trim(); SHOP.logo = pendingLogo;
        applyShop(); renderAll();
        toast('Đã cập nhật thông tin quán — áp dụng ngay lên hóa đơn, phiếu POS, thẻ QR và phía khách');
      });
      $('#sReset').addEventListener('click', () => {
        Object.assign(SHOP, SHOP_DEFAULT);
        applyShop(); renderAll();
        toast('Đã khôi phục tên, địa chỉ, số điện thoại và logo mẫu');
      });
    }

    /* ================== BÁO CÁO ================== */
    let reportPeriod = 'day';
    function rReport(){
      if(reportPeriod === 'month') return rReportMonth();
      if(reportPeriod === 'year') return rReportYear();
      return rReportDay();
    }
    function periodSeg(){
      const d = new Date();
      const opts = [['day','Hôm nay'],['month','Tháng ' + (d.getMonth() + 1) + '/' + d.getFullYear()],['year','Năm ' + d.getFullYear()]];
      return '<div class="toolbar"><div class="seg">' + opts.map(([k,l]) => '<button class="' + (reportPeriod === k ? 'active' : '') + '" data-rp="' + k + '">' + l + '</button>').join('') + '</div><span style="font-size:13px;color:var(--muted)">Mỗi hóa đơn vừa thu sẽ cộng ngay vào cả tháng và năm.</span></div>';
    }
    function bindPeriodSeg(){ $$('#view-baocao [data-rp]').forEach(b => b.addEventListener('click', () => { reportPeriod = b.dataset.rp; rReport(); })); }
    function rReportDay(){
      const billsTotal = BILLS.reduce((s,b) => s + b.total, 0);
      const rev = BASE_REVENUE + BILLS.slice(8).reduce((s,b) => s + b.total, 0);
      const nBills = 36 + (BILLS.length - 8);
      const maxH = Math.max(...HOUR_REV.map(h => h[1]));
      const W = 640, H = 190, bw = W / HOUR_REV.length;
      const bars = HOUR_REV.map((h, i) => {
        const bh = Math.round(h[1] / maxH * 130);
        return '<rect x="' + (i * bw + 9) + '" y="' + (155 - bh) + '" width="' + (bw - 18) + '" height="' + bh + '" rx="5" fill="' + (h[1] === maxH ? 'var(--brand)' : 'var(--brand-soft)') + '" stroke="var(--brand)" stroke-width="1"/>' +
          '<text x="' + (i * bw + bw / 2) + '" y="' + (155 - bh - 7) + '" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">' + h[1].toLocaleString('vi-VN') + '</text>' +
          '<text x="' + (i * bw + bw / 2) + '" y="176" text-anchor="middle" font-size="11.5" fill="var(--muted)">' + h[0] + '</text>';
      }).join('');
      const top = [...MENU].sort((a,b) => b.sold * b.price - a.sold * a.price).slice(0,5);
      const byMethod = ['Tiền mặt','Chuyển khoản','Thẻ'].map(mt => ({mt, n: BILLS.filter(b => b.method === mt).length + (mt === 'Chuyển khoản' ? 14 : mt === 'Tiền mặt' ? 12 : 2), total: BILLS.filter(b => b.method === mt).reduce((s,b) => s + b.total, 0) + (mt === 'Chuyển khoản' ? 2610000 : mt === 'Tiền mặt' ? 2145000 : 454000)}));
      $('#view-baocao').innerHTML =
        periodSeg() +
        '<div class="cards">' +
          '<div class="stat"><div class="lbl">' + IC.money + 'Doanh thu hôm nay</div><div class="val">' + fmt(rev) + '</div><div class="delta up">▲ 12,4% so với hôm qua</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.receipt + 'Hóa đơn đã thu</div><div class="val">' + nBills + '</div><div class="delta">gồm cả đơn tại quầy và QR</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.chart + 'Trung bình / hóa đơn</div><div class="val">' + fmt(Math.round(rev / nBills)) + '</div><div class="delta up">▲ 5,1% so với tuần trước</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.fire + 'Phần ăn đã bán</div><div class="val">' + MENU.reduce((s,m) => s + m.sold, 0) + '</div><div class="delta">trên ' + MENU.length + ' món trong thực đơn</div></div>' +
        '</div>' +
        '<div class="grid-2" style="margin-top:16px">' +
          '<div class="panel"><div class="panel-h"><h2>Doanh thu theo giờ</h2><span class="sub">· nghìn đồng</span></div><div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ doanh thu theo giờ">' + bars + '<line x1="0" y1="155" x2="' + W + '" y2="155" stroke="var(--line)"/></svg></div>' +
            '<div class="pay-split">' + byMethod.map(p => '<div class="ps"><span style="font-size:12.5px;color:var(--muted);font-weight:600">' + p.mt + ' · ' + p.n + ' đơn</span><b>' + fmt(p.total) + '</b></div>').join('') + '</div></div>' +
          '<div class="panel"><div class="panel-h"><h2>Món đóng góp doanh thu cao nhất</h2></div>' +
            top.map(m => '<div class="topdish"><img src="' + dishImgSrc(m) + '" alt="' + esc(m.name) + '"><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">' + esc(m.name) + '</b><span style="font-weight:800">' + fmt(m.sold * m.price) + '</span></div><div style="font-size:12.5px;color:var(--muted)">' + m.sold + ' phần × ' + fmt(m.price) + '</div><div class="bar"><i style="width:' + Math.round(m.sold * m.price / (top[0].sold * top[0].price) * 100) + '%"></i></div></div></div>').join('') +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-top:16px"><div class="panel-h"><h2>Hóa đơn gần nhất</h2></div><div style="overflow-x:auto"><table class="bills"><thead><tr><th>Mã HĐ</th><th>Bàn</th><th>Giờ</th><th>Hình thức</th><th class="num">Số tiền</th></tr></thead><tbody>' +
          [...BILLS].reverse().slice(0,10).map(b => '<tr><td><b>' + b.id + '</b></td><td>' + b.table.replace('B','Bàn ') + '</td><td>' + timeStr(b.at) + '</td><td>' + b.method + '</td><td class="num"><b>' + fmt(b.total) + '</b></td></tr>').join('') +
        '</tbody></table></div></div>';
      bindPeriodSeg();
    }

    /* ---------- Doanh thu theo tháng / năm (dữ liệu mẫu, cộng dồn hóa đơn vừa thu) ---------- */
    const MONTH_FULL_M = [198.5,176.2,214.8,228.4,241.9,219.6,233.2,247.5,238.7,261.3,252.8,274.6]; // triệu đồng / tháng trọn
    const MONTH_BILLS_FULL = [1024,918,1108,1189,1247,1135,1206,1281,1230,1348,1296,1412];
    const DAILY_M = [8.4,9.7,7.2,6.9,8.1,9.4,11.2,8.6,7.5,8.9,10.6,7.8,6.7,8.3,9.1,10.9,8.2,7.4,8.8,9.9,7.1,8.5,10.2,7.7,6.9,8.7,9.3,10.5,8.0,7.6]; // triệu đồng / ngày mẫu trong tháng
    function fmtFull(n){ if(n >= 1000000000) return (n / 1000000000).toLocaleString('vi-VN', {maximumFractionDigits:2}) + ' tỷ'; if(n >= 1000000) return Math.round(n / 1000000).toLocaleString('vi-VN') + 'tr'; return fmt(n); }
    function todayBillCount(){ return 36 + (BILLS.length - 8); }
    function dailySeries(){
      const day = new Date().getDate(), arr = [];
      for(let i = 1; i < day; i++) arr.push({day:i, rev: Math.round(DAILY_M[(i - 1) % DAILY_M.length] * 1000000), today:false});
      arr.push({day:day, rev: todayRevenue(), today:true});
      return arr;
    }
    function monthToDateRev(){ return dailySeries().reduce((s,x) => s + x.rev, 0); }
    function monthToDateBills(){ return (new Date().getDate() - 1) * 40 + todayBillCount(); }
    function monthsOfYear(){
      const cm = new Date().getMonth(), arr = [];
      for(let m = 0; m < 12; m++){
        if(m < cm) arr.push({m:m, rev: Math.round(MONTH_FULL_M[m] * 1000000), bills: MONTH_BILLS_FULL[m], st:'done'});
        else if(m === cm) arr.push({m:m, rev: monthToDateRev(), bills: monthToDateBills(), st:'cur'});
        else arr.push({m:m, rev:0, bills:0, st:'future'});
      }
      return arr;
    }
    function pctHtml(cur, prev){
      if(!prev) return '<span style="color:var(--muted)">—</span>';
      const p = (cur - prev) / prev * 100;
      return '<span class="' + (p >= 0 ? 'up' : 'down') + '" style="font-weight:700">' + (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toLocaleString('vi-VN', {maximumFractionDigits:1}) + '%</span>';
    }

    function rReportMonth(){
      const d = new Date(), day = d.getDate(), mo = d.getMonth(), yr = d.getFullYear();
      const series = dailySeries();
      const mtd = series.reduce((s,x) => s + x.rev, 0);
      const mBills = monthToDateBills();
      const prevSame = MONTH_FULL_M[(mo + 11) % 12] * 1000000 / 30 * day;
      const bestDay = series.reduce((a,b) => b.rev > a.rev ? b : a, series[0]);
      const maxD = Math.max(...series.map(x => x.rev));
      const W = 640, H = 190, bw = W / series.length;
      const bars = series.map((x, i) => {
        const bh = Math.max(4, Math.round(x.rev / maxD * 128));
        const showVal = x.today || x.rev === maxD || series.length <= 12;
        const showDay = series.length <= 15 || x.day % 5 === 0 || x.day === 1 || x.today;
        return '<rect x="' + (i * bw + 3) + '" y="' + (155 - bh) + '" width="' + (bw - 6) + '" height="' + bh + '" rx="4" fill="' + (x.today ? 'var(--brand)' : 'var(--brand-soft)') + '" stroke="var(--brand)" stroke-width="1"/>' +
          (showVal ? '<text x="' + (i * bw + bw / 2) + '" y="' + (155 - bh - 6) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">' + (x.rev / 1000000).toLocaleString('vi-VN', {maximumFractionDigits:1}) + '</text>' : '') +
          (showDay ? '<text x="' + (i * bw + bw / 2) + '" y="176" text-anchor="middle" font-size="11" fill="' + (x.today ? 'var(--brand-deep)' : 'var(--muted)') + '"' + (x.today ? ' font-weight="800"' : '') + '>' + x.day + '</text>' : '');
      }).join('');
      const topM = [...MENU].sort((a,b) => b.sold * b.price - a.sold * a.price).slice(0,5);
      const splits = [['Tiền mặt',.34],['Chuyển khoản',.47],['Thẻ',.19]].map(([mt, p]) => ({mt, n: Math.round(mBills * p), total: Math.round(mtd * p)}));
      const last7 = series.slice(-7).slice().reverse();
      $('#view-baocao').innerHTML =
        periodSeg() +
        '<div class="cards">' +
          '<div class="stat"><div class="lbl">' + IC.money + 'Doanh thu tháng ' + (mo + 1) + '/' + yr + '</div><div class="val">' + fmtK(mtd) + '</div><div class="delta">' + pctHtml(mtd, prevSame) + ' so với cùng kỳ tháng trước · tính đến hôm nay</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.receipt + 'Hóa đơn trong tháng</div><div class="val">' + mBills.toLocaleString('vi-VN') + '</div><div class="delta">từ ngày 1/' + (mo + 1) + ' đến hôm nay</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.chart + 'Trung bình / ngày</div><div class="val">' + fmtK(Math.round(mtd / day)) + '</div><div class="delta">ngày cao nhất: ' + bestDay.day + '/' + (mo + 1) + ' · ' + fmtK(bestDay.rev) + '</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.fire + 'Trung bình / hóa đơn</div><div class="val">' + fmt(Math.round(mtd / mBills)) + '</div><div class="delta">trên ' + MENU.reduce((s,m) => s + m.sold, 0) * day + ' phần ăn đã bán trong tháng</div></div>' +
        '</div>' +
        '<div class="grid-2" style="margin-top:16px">' +
          '<div class="panel"><div class="panel-h"><h2>Doanh thu theo ngày · Tháng ' + (mo + 1) + '/' + yr + '</h2><span class="sub">· triệu đồng</span></div><div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ doanh thu theo ngày trong tháng">' + bars + '<line x1="0" y1="155" x2="' + W + '" y2="155" stroke="var(--line)"/></svg></div>' +
            '<div class="pay-split">' + splits.map(p => '<div class="ps"><span style="font-size:12.5px;color:var(--muted);font-weight:600">' + p.mt + ' · ' + p.n.toLocaleString('vi-VN') + ' đơn</span><b>' + fmt(p.total) + '</b></div>').join('') + '</div></div>' +
          '<div class="panel"><div class="panel-h"><h2>Món đóng góp doanh thu cao nhất tháng</h2></div>' +
            topM.map(m => { const sm = m.sold * day; return '<div class="topdish"><img src="' + dishImgSrc(m) + '" alt="' + esc(m.name) + '"><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">' + esc(m.name) + '</b><span style="font-weight:800">' + fmt(sm * m.price) + '</span></div><div style="font-size:12.5px;color:var(--muted)">' + sm.toLocaleString('vi-VN') + ' phần × ' + fmt(m.price) + '</div><div class="bar"><i style="width:' + Math.round(sm * m.price / (topM[0].sold * day * topM[0].price) * 100) + '%"></i></div></div></div>'; }).join('') +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-top:16px"><div class="panel-h"><h2>Doanh thu 7 ngày gần nhất</h2></div><div style="overflow-x:auto"><table class="bills"><thead><tr><th>Ngày</th><th class="num">Doanh thu</th><th class="num">So với ngày trước</th></tr></thead><tbody>' +
          last7.map(x => { const idx = series.indexOf(x); const prev = idx > 0 ? series[idx - 1].rev : 0; return '<tr><td><b>' + x.day + '/' + (mo + 1) + '/' + yr + '</b>' + (x.today ? ' <span class="chip brand">Hôm nay</span>' : '') + '</td><td class="num"><b>' + fmt(x.rev) + '</b></td><td class="num">' + (prev ? pctHtml(x.rev, prev) : '<span style="color:var(--muted)">—</span>') + '</td></tr>'; }).join('') +
        '</tbody></table></div></div>';
      bindPeriodSeg();
    }

    function rReportYear(){
      const d = new Date(), yr = d.getFullYear(), cm = d.getMonth();
      const months = monthsOfYear();
      const done = months.filter(x => x.st !== 'future');
      const ytd = months.reduce((s,x) => s + x.rev, 0);
      const yBills = months.reduce((s,x) => s + x.bills, 0);
      const best = done.reduce((a,b) => b.rev > a.rev ? b : a, done[0]);
      const maxM = Math.max(...done.map(x => x.rev));
      const W = 640, H = 190, bw = W / 12;
      const bars = months.map((x, i) => {
        if(x.st === 'future') return '<rect x="' + (i * bw + 9) + '" y="151" width="' + (bw - 18) + '" height="4" rx="2" fill="var(--surface2)" stroke="var(--line)"/>' +
          '<text x="' + (i * bw + bw / 2) + '" y="140" text-anchor="middle" font-size="11" fill="var(--muted)">—</text>' +
          '<text x="' + (i * bw + bw / 2) + '" y="176" text-anchor="middle" font-size="11.5" fill="var(--muted)">T' + (x.m + 1) + '</text>';
        const bh = Math.max(4, Math.round(x.rev / maxM * 128));
        return '<rect x="' + (i * bw + 9) + '" y="' + (155 - bh) + '" width="' + (bw - 18) + '" height="' + bh + '" rx="5" fill="' + (x.st === 'cur' ? 'var(--amber-soft)' : x.rev === maxM ? 'var(--brand)' : 'var(--brand-soft)') + '" stroke="var(--brand)" stroke-width="1"/>' +
          '<text x="' + (i * bw + bw / 2) + '" y="' + (155 - bh - 7) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">' + Math.round(x.rev / 1000000) + '</text>' +
          '<text x="' + (i * bw + bw / 2) + '" y="176" text-anchor="middle" font-size="11.5" fill="' + (x.st === 'cur' ? 'var(--brand-deep)' : 'var(--muted)') + '"' + (x.st === 'cur' ? ' font-weight="800"' : '') + '>T' + (x.m + 1) + '</text>';
      }).join('');
      const years = [{y:yr - 2, rev:1984200000, bills:10284, cur:false}, {y:yr - 1, rev:2347100000, bills:12156, cur:false}, {y:yr, rev:ytd, bills:yBills, cur:true}];
      const maxY = Math.max(...years.map(x => x.rev));
      $('#view-baocao').innerHTML =
        periodSeg() +
        '<div class="cards">' +
          '<div class="stat"><div class="lbl">' + IC.money + 'Doanh thu năm ' + yr + '</div><div class="val">' + fmtFull(ytd) + '</div><div class="delta">đến hết tháng ' + (cm + 1) + ' · đang cộng dồn</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.receipt + 'Hóa đơn trong năm</div><div class="val">' + yBills.toLocaleString('vi-VN') + '</div><div class="delta">gồm cả đơn tại quầy và QR</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.chart + 'Trung bình / tháng</div><div class="val">' + fmtK(Math.round(ytd / done.length)) + '</div><div class="delta">trên ' + done.length + ' tháng đã có doanh thu</div></div>' +
          '<div class="stat"><div class="lbl">' + IC.fire + 'Tháng cao nhất</div><div class="val">' + fmtK(best.rev) + '</div><div class="delta">Tháng ' + (best.m + 1) + '/' + yr + (best.st === 'cur' ? ' · chưa hết tháng' : '') + '</div></div>' +
        '</div>' +
        '<div class="panel" style="margin-top:16px"><div class="panel-h"><h2>Doanh thu theo tháng · Năm ' + yr + '</h2><span class="sub">· triệu đồng · tháng hiện tại tính đến hôm nay</span></div><div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ doanh thu theo tháng trong năm">' + bars + '<line x1="0" y1="155" x2="' + W + '" y2="155" stroke="var(--line)"/></svg></div></div>' +

    function gItemHtml(m){
      const q = gCart[m.id] || 0;
      return '<div class="g-item' + (m.out ? ' soldout' : '') + '"><img src="' + dishImgSrc(m) + '" alt="' + esc(m.name) + '"><div class="inf">' +
        '<div class="nm">' + esc(m.name) + (m.best ? '<span class="chip brand">Bán chạy</span>' : '') + (m.out ? '<span class="chip red">Hết món</span>' : '') + '</div>' +
        '<div class="ds">' + esc(m.desc) + '</div>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:3px">Nấu ~' + m.time + ' phút</div>' +
        '<div class="row"><span class="pr">' + fmt(m.price) + '</span>' +
        (m.out ? '' : '<span class="qty-ctl">' + (q ? '<button class="minus" data-dec="' + m.id + '">−</button><span class="n">' + q + '</span>' : '') + '<button class="plus" data-inc="' + m.id + '">+</button></span>') +
        '</div></div></div>';
    }
    function bindQtyButtons(){
      const grab = () => { const s = $('#gScroll'); if(s) lastScroll = s.scrollTop; };
      $$('#phoneRoot [data-inc]').forEach(b => b.addEventListener('click', () => { grab(); gCart[b.dataset.inc] = (gCart[b.dataset.inc] || 0) + 1; renderGuest(); keepScroll(); }));
      $$('#phoneRoot [data-dec]').forEach(b => b.addEventListener('click', () => { grab(); const id = b.dataset.dec; gCart[id]--; if(gCart[id] <= 0) delete gCart[id]; renderGuest(); keepScroll(); }));
    }
    let lastScroll = 0;
    function keepScroll(){ const s = $('#gScroll'); if(s) s.scrollTop = lastScroll; }
    function openCart(){
      const entries = Object.entries(gCart).filter(([,q]) => q > 0);
      if(!entries.length) return;
      openSheet('<div style="display:flex;align-items:center;gap:10px"><h3>Giỏ món · ' + gTable.replace('B','Bàn ') + '</h3><button class="btn btn-ghost btn-sm" style="margin-left:auto" data-close="1">Đóng</button></div><div style="height:8px"></div>' +
        entries.map(([id, q]) => { const m = menuById(id); return '<div class="bill-line"><span class="q">' + q + '×</span><span>' + esc(m.name) + '</span><span class="p">' + fmt(m.price * q) + '</span></div>'; }).join('') +
        '<div class="bill-sum" style="margin-top:8px"><span>Tạm tính</span><span>' + fmt(cartTotal()) + '</span></div>' +
        '<div class="bill-sum"><span>VAT 8%</span><span>' + fmt(withVAT(cartTotal()) - cartTotal()) + '</span></div>' +
        '<div class="bill-sum total"><span>Tổng cộng</span><span>' + fmt(withVAT(cartTotal())) + '</span></div>' +
        '<div class="field" style="margin-top:12px"><label>Ghi chú cho bếp (ít cay, không hành…)</label><textarea id="gNote" rows="2" placeholder="Không bắt buộc"></textarea></div>' +
        '<button class="btn btn-brand" style="width:100%" id="gPlace">Gửi đơn vào bếp</button>' +
        '<p style="font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0 0">Thanh toán sau khi dùng bữa — tại quầy hoặc gọi nhân viên mang hóa đơn tới bàn.</p>');
      $('#gPlace').addEventListener('click', () => {
        const note = $('#gNote').value.trim();
        const o = {id:'DH' + (orderSeq++), table:gTable, src:'QR', at:Date.now(), note, paid:false,
          items: entries.map(([id, q]) => { menuById(id).sold += q; return {mid:id, qty:q, note:'', st:'cho'}; })};
        ORDERS.push(o);
        announceNewOrder(o);
        gCart = {};
        feedPush('receipt', 'brand', 'Đơn ' + o.id + ' · ' + gTable.replace('B','Bàn '), 'Khách quét QR đặt ' + o.items.reduce((s,i) => s + i.qty, 0) + ' món');
        closeModal(); gScreen = 'orders'; renderGuest(); renderNav(); renderBell();
        toast('Đã gửi đơn ' + o.id + ' vào bếp');
      });
    }
    function renderGuestOrders(root){
      const my = ordersOfTable(gTable);
      const stepsFor = o => {
        const st = orderStatus(o).k;
        const idx = st === 'moi' ? 1 : st === 'nau' ? 2 : 3;
        const labels = ['Đã gửi bếp','Bếp đang nấu','Món đã ra'];
        return '<div class="steps">' + labels.map((l, i) => '<div class="stp' + (i < idx ? ' on' : '') + '"><i>' + IC.check + '</i><span>' + l + '</span></div>').join('') + '</div>';
      };
      root.innerHTML = '<div style="display:flex;align-items:center;gap:10px;padding:16px 16px 4px"><button class="bell-btn" id="gBackMenu" aria-label="Quay lại menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M19 12H5m6-7-7 7 7 7"/></svg></button><div><div style="font-weight:800;font-size:18px">Đơn của tôi · ' + gTable.replace('B','Bàn ') + '</div><div style="font-size:12.5px;color:var(--muted)">Theo dõi món đang nấu theo thời gian thực</div></div></div>' +
        '<div class="g-orders">' +
        (my.length ? my.map(o => '<div class="g-order-card"><div style="display:flex;align-items:center;gap:8px"><b>' + o.id + '</b><span class="chip ' + orderStatus(o).chip + '">' + orderStatus(o).label + '</span><span style="margin-left:auto;font-size:12.5px;color:var(--muted)">' + timeStr(o.at) + '</span></div>' + stepsFor(o) +
          o.items.map(it => { const m = menuById(it.mid); return '<div class="bill-line"><span class="q">' + it.qty + '×</span><span>' + esc(m.name) + '</span><span class="chip ' + (it.st === 'xong' ? 'green' : it.st === 'nau' ? 'blue' : 'red') + '">' + (it.st === 'xong' ? 'Đã ra' : it.st === 'nau' ? 'Đang nấu' : 'Chờ bếp') + '</span><span class="p">' + fmt(m.price * it.qty) + '</span></div>'; }).join('') +
          '<div class="bill-sum total"><span>Tổng đơn</span><span>' + fmt(withVAT(orderTotal(o))) + '</span></div></div>').join('')
        : '<div class="g-empty"><div class="big">Chưa có đơn nào</div><p style="margin:0">Quay lại menu và chọn món đầu tiên anh/chị nhé.</p></div>') +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button class="btn btn-ghost" id="gCall2">' + IC.bell + ' Gọi nhân viên</button><button class="btn btn-brand" id="gMore">Gọi thêm món</button></div>' +
        '<button class="btn btn-ghost" id="gBill2">' + IC.wallet + ' Yêu cầu thanh toán</button>' +
        '</div>';
      $('#gBackMenu').addEventListener('click', () => { gScreen = 'menu'; renderGuest(); });
      $('#gMore').addEventListener('click', () => { gScreen = 'menu'; renderGuest(); });
      $('#gCall2').addEventListener('click', () => guestCall('Gọi nhân viên'));
      $('#gBill2').addEventListener('click', guestBill);
    }
    function guestCall(kind){
      if(CALLS.some(c => c.table === gTable)){ toast(gTable.replace('B','Bàn ') + ' đã gọi — nhân viên đang đến'); return; }
      CALLS.push({table:gTable, at:Date.now(), kind});
      feedPush('bell', 'red', gTable.replace('B','Bàn ') + ' gọi nhân viên', 'Khách bấm nút gọi trên điện thoại');
      renderBell();
      announceCall(gTable, 'gọi nhân viên');
      toast('Đã gọi nhân viên — quán sẽ đến ' + gTable.replace('B','bàn ') + ' ngay');
    }
    function guestBill(){
      const t = TABLES.find(x => x.id === gTable);
      if(!ordersOfTable(gTable).length){ toast('Bàn chưa có đơn để thanh toán', true); return; }
      t.billReq = true;
      if(!CALLS.some(c => c.table === gTable)) CALLS.push({table:gTable, at:Date.now(), kind:'Xin thanh toán'});
      feedPush('wallet', 'amber', gTable.replace('B','Bàn ') + ' xin thanh toán', 'Tổng tạm tính ' + fmt(withVAT(tableDue(gTable))));
      renderBell();
      announceCall(gTable, 'xin thanh toán');
      toast('Đã gửi yêu cầu — nhân viên sẽ mang hóa đơn ' + fmt(withVAT(tableDue(gTable))) + ' tới bàn');
    }

    /* ================== CHUÔNG GỌI & KHỞI TẠO ================== */
    $('#bellBtn').addEventListener('click', () => {
      if(!CALLS.length){ toast('Không có lời gọi nào đang chờ'); return; }
      openSheet('<h3>Khách đang gọi</h3><div style="height:8px"></div>' + CALLS.map(c =>
        '<div class="feed-item" style="border:1px solid var(--line);border-radius:13px;margin-bottom:9px"><div class="feed-ic chip red">' + IC.bell + '</div><div><div class="t">' + c.table.replace('B','Bàn ') + ' · ' + c.kind + '</div><div class="s">' + ago(c.at) + ' trước</div></div><button class="btn btn-brand btn-sm" style="margin-left:auto" data-ack="' + c.table + '">Đã đến bàn</button></div>'
      ).join(''));
      $$('#modalRoot [data-ack]').forEach(b => b.addEventListener('click', () => {
        const i = CALLS.findIndex(c => c.table === b.dataset.ack); if(i >= 0) CALLS.splice(i, 1);
        closeModal(); renderAll(); toast('Đã xử lý lời gọi của ' + b.dataset.ack.replace('B','bàn '));
      }));
    });
    renderSoundBtn();
    $('#soundBtn').addEventListener('click', () => {
      soundOn = !soundOn;
      if(soundOn){ unlockAudio(); playShortChime(); }
      else if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }
      renderSoundBtn();
      if(curView === 'bep') renderView();
      toast(soundOn ? 'Đã BẬT âm thanh báo đơn cho bếp' : 'Đã TẮT âm thanh báo đơn cho bếp');
    });
    $('#btnGuestMode').addEventListener('click', () => openGuest(null));
    function tickClock(){
      const d = new Date();
      $('#clock').textContent = d.toLocaleDateString('vi-VN', {weekday:'short', day:'2-digit', month:'2-digit'}) + ' · ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    applyShop(); tickClock(); setInterval(tickClock, 20000);
    setInterval(() => { const s = $('#gScroll'); if(s) lastScroll = s.scrollTop; }, 400);
    // Nếu mở trang bằng link QR (#ban=B05) → vào thẳng phía khách của bàn đó
    const mh = (location.hash || '').match(/ban=([A-Za-z0-9]{2,6})/i);
    go('tongquan');
    if(mh && TABLES.some(t => t.id === mh[1].toUpperCase())) openGuest(mh[1].toUpperCase());
    </script>
  </body>
</html>
