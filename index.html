<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Quản lý nhà hàng — Order QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      :root{
        --bg:#FAF5EF; --surface:#FFFFFF; --surface2:#F4EBE0; --ink:#241A12; --muted:#857463;
        --line:#EADBC9; --brand:#E4571D; --brand-deep:#B93F0E; --brand-soft:#FDEADB;
        --green:#1E9E6A; --green-soft:#E2F4EA; --amber:#D98A12; --amber-soft:#FBF0DA;
        --red:#D24545; --red-soft:#FBE7E4; --blue:#2E7CD6; --blue-soft:#E4EFFB;
        --shadow:0 10px 30px rgba(90,45,10,.10); --shadow-sm:0 2px 10px rgba(90,45,10,.08);
        --r-lg:18px; --r-md:14px; --r-sm:10px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#17120E; --surface:#221B15; --surface2:#2C231B; --ink:#F6EDE3; --muted:#B7A48F;
          --line:#3B2E22; --brand:#F06A28; --brand-deep:#FF8A4D; --brand-soft:#3A2415;
          --green:#3FBF85; --green-soft:#173427; --amber:#E5A83E; --amber-soft:#3A2E14;
          --red:#E86A6A; --red-soft:#3B1F1E; --blue:#5EA3E8; --blue-soft:#18293F;
          --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.35);
        }
      }
      *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
      html,body{height:100%}
      body{margin:0; font-family:"Be Vietnam Pro",system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45}
      button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
      input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink)}
      img{display:block}
      svg.ic{width:20px;height:20px;flex:none}
      .hidden{display:none !important}

      /* ---------- Layout nhân viên ---------- */
      #app{display:flex; min-height:100dvh}
      #sidebar{width:248px; flex:none; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100dvh; z-index:30}
      .brand{padding:20px 20px 14px; display:flex; gap:12px; align-items:center}
      .brand-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#F0681F,#C33D08);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-sm)}
      .brand-mark svg{width:26px;height:26px}
      .brand-mark.has-logo{background:#fff; border:1px solid var(--line); overflow:hidden}
      .brand-mark img{width:100%; height:100%; object-fit:contain}
      .logo-ph{width:104px; height:104px; border-radius:10px; flex:none; display:grid; place-items:center; background:var(--surface2); color:var(--muted); font-size:12px; font-weight:700; text-align:center; padding:8px}
      .brand-name{font-family:"Playfair Display",serif; font-size:20px; font-weight:800; line-height:1.1}
      .brand-sub{font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase}
      .side-label{padding:14px 20px 6px; font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--muted); text-transform:uppercase}
      .nav-btn{display:flex; align-items:center; gap:12px; margin:2px 12px; padding:11px 12px; border-radius:12px; font-size:14.5px; font-weight:600; color:var(--ink); text-align:left; width:calc(100% - 24px); position:relative; transition:background .15s}
      .nav-btn:hover{background:var(--surface2)}
      .nav-btn.active{background:var(--brand-soft); color:var(--brand-deep)}
      .nav-btn .cnt{margin-left:auto; background:var(--brand); color:#fff; font-size:11.5px; font-weight:800; min-width:22px; height:22px; padding:0 6px; border-radius:99px; display:grid; place-items:center}
      .nav-btn .cnt.gray{background:var(--surface2); color:var(--muted)}
      .side-foot{margin-top:auto; padding:16px; border-top:1px solid var(--line)}
      .guest-open-btn{width:100%; display:flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg); padding:12px 14px; border-radius:12px; font-weight:700; font-size:14px}
      .guest-open-btn:hover{opacity:.9}
      .demo-note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5}

      #mainWrap{flex:1; min-width:0; display:flex; flex-direction:column}
      #topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 26px; display:flex; align-items:center; gap:14px}
      #topbar h1{font-size:20px; margin:0; font-weight:800}
      #topbar .sub{font-size:12.5px; color:var(--muted)}
      .top-spacer{flex:1}
      .clock-chip{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); padding:8px 13px; border-radius:99px; font-weight:700; font-size:13.5px}
      .bell-btn{position:relative; width:42px; height:42px; border-radius:12px; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center}
      .bell-dot{position:absolute; top:-5px; right:-5px; background:var(--red); color:#fff; font-size:11px; font-weight:800; min-width:20px; height:20px; border-radius:99px; display:grid; place-items:center; padding:0 5px}
      .bell-btn.ringing{animation:ring 1s ease infinite}
      @keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(10deg)}40%{transform:rotate(-8deg)}60%{transform:rotate(5deg)}}
      main#views{padding:22px 26px 90px; max-width:1240px; width:100%; margin:0 auto}
      .view{display:none}
      .view.active{display:block; animation:fadein .25s ease}
      @keyframes fadein{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}

      /* ---------- Thành phần chung ---------- */
      .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
      .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; box-shadow:var(--shadow-sm)}
      .stat .lbl{font-size:12.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:8px}
      .stat .val{font-size:27px; font-weight:800; margin-top:6px; letter-spacing:-.01em}
      .stat .delta{font-size:12.5px; margin-top:3px; font-weight:600}
      .up{color:var(--green)} .down{color:var(--red)}
      .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm)}
      .panel-h{padding:16px 18px 10px; display:flex; align-items:center; gap:10px}
      .panel-h h2{font-size:16.5px; margin:0; font-weight:800}
      .panel-h .sub{font-size:12.5px; color:var(--muted)}
      .grid-2{display:grid; grid-template-columns:1.6fr 1fr; gap:16px}
      .chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap}
      .chip.green{background:var(--green-soft); color:var(--green)}
      .chip.amber{background:var(--amber-soft); color:var(--amber)}
      .chip.red{background:var(--red-soft); color:var(--red)}
      .chip.blue{background:var(--blue-soft); color:var(--blue)}
      .chip.brand{background:var(--brand-soft); color:var(--brand-deep)}
      .chip.gray{background:var(--surface2); color:var(--muted)}
      .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:14px; padding:11px 18px; border-radius:12px; transition:filter .15s, transform .05s}
      .btn:active{transform:scale(.98)}
      .btn-brand{background:var(--brand); color:#fff}
      .btn-brand:hover{background:var(--brand-deep)}
      .btn-ghost{background:var(--surface); border:1px solid var(--line); color:var(--ink)}
      .btn-ghost:hover{background:var(--surface2)}
      .btn-green{background:var(--green); color:#fff}
      .btn-sm{padding:8px 13px; font-size:13px; border-radius:10px}
      .btn[disabled]{opacity:.45; pointer-events:none}
      .search-box{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 13px; height:44px}
      .search-box input{border:none; outline:none; background:none; flex:1; min-width:0}
      .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
      .seg{display:flex; background:var(--surface2); border-radius:12px; padding:4px; gap:2px}
      .seg button{padding:8px 14px; border-radius:9px; font-weight:600; font-size:13.5px; color:var(--muted)}
      .seg button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}

      /* Hero tổng quan */
      .hero{position:relative; border-radius:20px; overflow:hidden; min-height:172px; display:flex; align-items:flex-end; margin-bottom:16px; box-shadow:var(--shadow)}
      .hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
      .hero::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(24,10,2,.78) 30%, rgba(24,10,2,.15) 75%)}
      .hero-txt{position:relative; z-index:1; padding:22px 24px; color:#FFF7EE; max-width:600px}
      .hero-txt h2{font-family:"Playfair Display",serif; font-size:27px; margin:0 0 6px}
      .hero-txt p{margin:0; font-size:14px; opacity:.92}

      /* Hoạt động trực tiếp */
      .feed-item{display:flex; gap:12px; padding:11px 18px; border-top:1px solid var(--line); align-items:flex-start}
      .feed-item:first-of-type{border-top:none}
      .feed-ic{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex:none}
      .feed-ic svg{width:18px; height:18px}
      .feed-item .t{font-size:13.5px; font-weight:600}
      .feed-item .s{font-size:12px; color:var(--muted)}
      .feed-item time{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap}

      /* ---------- Bàn ---------- */
      .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted); font-weight:600}
      .legend i{width:12px; height:12px; border-radius:4px; display:inline-block; margin-right:6px; vertical-align:-1px}
      .zone-title{font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:20px 0 10px}
      .tables-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:14px}
      .table-card{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-lg); padding:15px; text-align:left; width:100%; box-shadow:var(--shadow-sm); position:relative; transition:transform .12s, border-color .12s}
      .table-card:hover{transform:translateY(-2px)}
      .table-card .tno{font-size:19px; font-weight:800; display:flex; align-items:center; gap:8px}
      .table-card .meta{font-size:12.5px; color:var(--muted); margin-top:2px}
      .table-card .amt{font-size:16px; font-weight:800; margin-top:9px}
      .table-card .st{margin-top:8px}
      .table-card.free{border-color:var(--line)}
      .table-card.busy{border-color:var(--brand); background:linear-gradient(180deg, var(--brand-soft), var(--surface) 55%)}
      .table-card.waitpay{border-color:var(--amber); background:linear-gradient(180deg, var(--amber-soft), var(--surface) 55%)}
      .table-card .call-flag{position:absolute; top:10px; right:10px; background:var(--red); color:#fff; font-size:11px; font-weight:800; padding:4px 8px; border-radius:99px; animation:pulse 1.2s infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

      /* ---------- Bếp ---------- */
      .kitchen-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; align-items:start}
      .k-order{border-radius:var(--r-lg); overflow:hidden}
      .k-order.new{border:1.5px solid var(--red)}
      .k-head{display:flex; align-items:center; gap:10px; padding:13px 15px; border-bottom:1px dashed var(--line)}
      .k-head .tno{font-size:17px; font-weight:800}
      .k-head time{margin-left:auto; font-weight:800; font-size:14px}
      .k-head time.late{color:var(--red)}
      .k-item{display:flex; align-items:center; gap:10px; padding:10px 15px; border-top:1px solid var(--line)}
      .k-item:first-of-type{border-top:none}
      .k-item .qty{font-weight:800; background:var(--surface2); border-radius:8px; min-width:30px; height:30px; display:grid; place-items:center; font-size:13.5px}
      .k-item .nm{flex:1; min-width:0}
      .k-item .nm b{font-size:14px; display:block}
      .k-item .nm span{font-size:12px; color:var(--amber); font-weight:600}
      .k-item.done{opacity:.48}
      .k-item.done .nm b{text-decoration:line-through}

      /* ---------- Âm thanh báo bếp: banner đơn mới + nút loa ---------- */
      .k-banner{display:flex; align-items:center; gap:11px; background:linear-gradient(90deg,#C22E2E,#E4571D); color:#fff; border-radius:14px; padding:13px 16px; margin-bottom:14px; font-weight:800; font-size:15.5px; box-shadow:var(--shadow); animation:kflash .7s ease-in-out infinite alternate}
      .k-banner .sub{font-weight:600; font-size:13px; opacity:.93}
      .k-banner svg{width:22px; height:22px; flex:none}
      @keyframes kflash{from{filter:brightness(1)}to{filter:brightness(1.3)}}
      .k-order.just-new{border:2px solid var(--red); animation:newGlow 1.1s ease-in-out infinite}
      @keyframes newGlow{0%,100%{box-shadow:0 0 0 0 rgba(210,69,69,0)}50%{box-shadow:0 0 0 6px rgba(210,69,69,.30)}}
      .sound-btn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); padding:8px 13px; border-radius:99px; font-weight:700; font-size:13.5px; color:var(--ink)}
      .sound-btn svg{width:19px; height:19px}
      .sound-btn.off{color:var(--muted)}
      .sound-btn .dot{width:9px; height:9px; border-radius:50%; background:var(--green); flex:none}
      .sound-btn.off .dot{background:var(--red)}
      @media(max-width:560px){ .sound-btn .sb-txt{display:none} .sound-btn{padding:8px 11px} }

      /* ---------- Đơn hàng ---------- */
      .order-row{display:flex; align-items:center; gap:14px; padding:14px 18px; border-top:1px solid var(--line); width:100%; text-align:left; background:none}
      .order-row:first-of-type{border-top:none}
      .order-row:hover{background:var(--surface2)}
      .order-row .oid{font-weight:800}
      .order-row .meta{font-size:12.5px; color:var(--muted)}
      .order-row .amt{margin-left:auto; font-weight:800; text-align:right}
      .order-row .amt .meta{display:block}

      /* ---------- Thực đơn (quản lý) ---------- */
      .menu-admin{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
      .ma-card{display:flex; gap:13px; padding:13px; align-items:center}
      .ma-card img{width:74px; height:74px; border-radius:12px; object-fit:cover; flex:none}
      .ma-card .ph{width:74px; height:74px; border-radius:12px; flex:none; display:grid; place-items:center; font-weight:800; font-size:24px; color:#fff; background:linear-gradient(135deg,#B9BDC4,#878C94)}
      .ma-card .inf{flex:1; min-width:0}
      .ma-card .nm{font-weight:700; font-size:14.5px}
      .ma-card .pr{color:var(--brand-deep); font-weight:800; font-size:14px}
      .switch{position:relative; width:46px; height:26px; flex:none}
      .switch input{opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; z-index:1}
      .switch .tr{position:absolute; inset:0; background:var(--surface2); border:1px solid var(--line); border-radius:99px; transition:background .15s}
      .switch .tr::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition:left .15s}
      .switch input:checked + .tr{background:var(--green)}
      .switch input:checked + .tr::after{left:22px}

      /* ---------- QR ---------- */
      .qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:16px}
      .qr-card{padding:18px; text-align:center}
      .qr-box{width:148px; height:148px; margin:6px auto 10px; background:#fff; border:1px solid var(--line); border-radius:12px; display:grid; place-items:center; padding:8px}
      .qr-box img,.qr-box canvas{width:132px !important; height:132px !important}
      .qr-card .tno{font-weight:800; font-size:16.5px}
      .qr-card .lnk{font-size:11px; color:var(--muted); word-break:break-all; margin:3px 0 12px}

      /* ---------- Thiết lập bàn ---------- */
      .setup-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:16px}
      .setup-card{padding:16px; text-align:center}
      .setup-card .tno{font-weight:800; font-size:17px}
      .setup-card .meta{font-size:12.5px; color:var(--muted); margin-top:2px}
      .setup-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
      .setup-actions .btn{width:100%}

      /* ---------- Báo cáo ---------- */
      .chart-wrap{padding:6px 18px 16px}
      .chart-wrap svg{width:100%; height:auto; display:block}
      .topdish{display:flex; align-items:center; gap:12px; padding:10px 18px; border-top:1px solid var(--line)}
      .topdish:first-of-type{border-top:none}
      .topdish img{width:44px; height:44px; border-radius:10px; object-fit:cover}
      .topdish .bar{height:7px; border-radius:99px; background:var(--surface2); overflow:hidden; margin-top:5px}
      .topdish .bar i{display:block; height:100%; background:var(--brand); border-radius:99px}
      table.bills{width:100%; border-collapse:collapse}
      table.bills th,table.bills td{padding:11px 18px; text-align:left; font-size:13.5px; border-top:1px solid var(--line)}
      table.bills th{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; border-top:none}
      table.bills td.num,table.bills th.num{text-align:right}
      table.bills.months th:nth-child(3),table.bills.months td:nth-child(3){display:table-cell}
      @media(max-width:560px){ table.bills.months th:nth-child(4),table.bills.months td:nth-child(4),table.bills.months th:nth-child(5),table.bills.months td:nth-child(5){display:none} }
      .pay-split{display:flex; gap:12px; padding:4px 18px 18px}
      .pay-split .ps{flex:1; background:var(--surface2); border-radius:12px; padding:12px}
      .pay-split .ps b{display:block; font-size:16px}

      /* ---------- Modal / sheet ---------- */
      .overlay{position:fixed; inset:0; background:rgba(20,10,3,.55); z-index:150; display:flex; align-items:flex-end; justify-content:center; animation:fadein .2s}
      .sheet{background:var(--bg); width:100%; max-width:560px; max-height:92dvh; overflow-y:auto; border-radius:22px 22px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); animation:up .25s ease}
      @keyframes up{from{transform:translateY(26px); opacity:.6}to{transform:none; opacity:1}}
      @media(min-width:760px){ .overlay{align-items:center} .sheet{border-radius:22px} }
      .sheet h3{margin:0 0 4px; font-size:19px; font-weight:800}
      .sheet .close-x{position:absolute}
      .bill-line{display:flex; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px}
      .bill-line .q{font-weight:800}
      .bill-line .p{margin-left:auto; font-weight:700; white-space:nowrap}
      .bill-sum{display:flex; justify-content:space-between; padding:6px 0; font-size:14px}
      .bill-sum.total{font-size:18px; font-weight:800; border-top:2px solid var(--ink); padding-top:12px; margin-top:6px}
      .field{margin-bottom:13px}
      .field label{display:block; font-size:13px; font-weight:700; margin-bottom:6px}
      .field input,.field select,.field textarea{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:11px 13px; outline:none}
      .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
      /* Chọn / tải ảnh món trong form món */
      .img-pick{display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:10px}
      .img-pick.drag{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
      .img-pick>img{width:104px; height:104px; border-radius:10px; object-fit:cover; flex:none; background:var(--surface2)}
      .img-pick .logo-prev{width:104px; height:104px; border-radius:10px; object-fit:contain; background:#fff; flex:none; border:1px solid var(--line)}
      .img-pick-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px}
      .img-pick-body select{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:10px 12px; outline:none}
      .img-pick-body select:focus{border-color:var(--brand)}
      .img-pick-body .btn{align-self:flex-start}
      .img-hint{font-size:12px; color:var(--muted); line-height:1.5}
      @media(max-width:480px){ .img-pick{flex-direction:column} .img-pick>img{width:100%; height:160px} .img-pick .logo-prev{width:100%; height:160px} .img-pick-body .btn{align-self:stretch} }
      .pay-methods{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
      .pay-methods button{border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 6px; font-weight:700; font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:6px}
      .pay-methods button.active{border-color:var(--brand); background:var(--brand-soft); color:var(--brand-deep)}
      .receipt{background:#fff; color:#241A12; border-radius:14px; padding:20px; font-size:13.5px; box-shadow:var(--shadow)}

      /* Thanh hành động dính đáy sheet — luôn bấm được, không phải cuộn tìm */
      .sheet-actions{position:sticky; bottom:calc(-20px - env(safe-area-inset-bottom)); margin:14px -20px calc(-20px - env(safe-area-inset-bottom)); padding:12px 20px calc(14px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); z-index:5}

      .paper-row .lbl{font-size:13px; font-weight:700; color:var(--muted); display:inline-flex; align-items:center; gap:6px}
      .paper-row .seg{margin-left:auto}
      .paper-row .seg button{padding:6px 12px; font-size:13px}

      .pos .pc{text-align:center}
      .pos .shop{font-size:19px; font-weight:700; letter-spacing:.03em}
      .pos.w58 .shop{font-size:16px}
      .pos .ttl{font-size:14.5px; font-weight:700; letter-spacing:.02em}
      .pos .phr{border-top:1.5px dashed #000; margin:6px 0}
      .pos .pr{display:flex; justify-content:space-between; gap:8px}
      .pos .pr span:last-child{white-space:nowrap; font-weight:700}
      .pos .pn{font-size:11px; padding-left:16px}
      .pos .tot{font-size:16px; font-weight:700; border-top:1.5px solid #000; margin-top:5px; padding-top:5px}
      .pos.w58 .tot{font-size:13.5px}
      .pos-screen{padding:14px 12px 18px; border-radius:6px; box-shadow:var(--shadow)}

        @page{margin:0}
        html,body{background:#fff !important}
        body>*:not(#posArea){display:none !important}
        #posArea{display:block !important}
        #posArea .pos{padding:3mm 1mm 5mm}

      /* Toast */
      #toastRoot{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:max-content; max-width:92vw; pointer-events:none}

      /* Bottom nav mobile */
      #bottomNav{display:none}

        #sidebar{display:none}
        main#views{padding:16px 14px 96px}

        #topbar h1{font-size:17px}
        .clock-chip{display:none}
        .cards{grid-template-columns:repeat(2,1fr)}

      }
      @media(max-width:560px){
        .tables-grid{grid-template-columns:repeat(2,1fr)}
        .kitchen-grid{grid-template-columns:1fr}
        .pay-split{flex-direction:column}
        table.bills th:nth-child(3),table.bills td:nth-child(3){display:none}
      }

      /* ---------- Phía khách (điện thoại) ---------- */
      #guestView{position:fixed; inset:0; z-index:100; background:#241109; display:none}
      #guestView.open{display:block}
      .phone{max-width:430px; margin:0 auto; height:100dvh; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden}
      @media(min-width:760px){ .phone{height:calc(100dvh - 36px); margin-top:18px; border-radius:34px; border:10px solid #0E0A07; box-shadow:0 30px 80px rgba(0,0,0,.5)} }
      .g-scroll{flex:1; overflow-y:auto; overscroll-behavior:contain}
      .g-head{position:relative; color:#FFF6EC}
      .g-head img{width:100%; height:158px; object-fit:cover; display:block}
      .g-head::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(26,11,2,.45), rgba(26,11,2,.82))}
      .g-head-txt{position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; justify-content:flex-end; padding:16px 18px}
      .g-head-txt .rn{font-family:"Playfair Display",serif; font-size:24px; font-weight:800}
      .g-table-chip{align-self:flex-start; background:var(--brand); color:#fff; font-weight:800; font-size:12.5px; padding:5px 12px; border-radius:99px; margin-bottom:7px}
      .g-back{position:absolute; top:12px; left:12px; z-index:2; background:rgba(20,10,3,.55); color:#fff; width:38px; height:38px; border-radius:50%; display:grid; place-items:center}
      .g-actions{display:flex; gap:9px; padding:13px 16px 4px}
      .g-actions button{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 6px; font-weight:700; font-size:13px; box-shadow:var(--shadow-sm)}
      .g-cats{position:sticky; top:0; z-index:5; background:var(--bg); padding:11px 16px 9px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none}
      .g-cats::-webkit-scrollbar{display:none}
      .g-cats button{flex:none; padding:8px 15px; border-radius:99px; background:var(--surface); border:1px solid var(--line); font-weight:700; font-size:13.5px}
      .g-cats button.active{background:var(--ink); color:var(--bg); border-color:var(--ink)}

      .g-list{padding:8px 16px 110px; display:flex; flex-direction:column; gap:12px}
      .g-item{display:flex; gap:13px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:11px; box-shadow:var(--shadow-sm)}
      .g-item img{width:96px; height:96px; border-radius:12px; object-fit:cover; flex:none}

      .g-item .pr{font-weight:800; color:var(--brand-deep); font-size:15.5px}

        texts.push(tableSpeechName(tid) + ': ' + itemsSpeechText([...byTable.get(tid).values()]));
      });
      /* Câu chốt ngắn: bàn chờ lâu nhất tính theo đơn có món chờ vào bếp sớm nhất */
      const oldest = os.slice().sort((a, b) => a.at - b.at)[0];

    }

    /* Ảnh món: tên file mẫu trong assets/, hoặc data URL khi người dùng tải ảnh thật lên */
    function dishImgSrc(m){ const s = (m && m.img) || ''; return (s.indexOf('data:') === 0 || s.indexOf('http') === 0) ? s : 'assets/' + s; }
    function readDishImage(file, cb){
      if(!file) return;
      if(!/^image\//.test(file.type || '')){ toast('File vừa chọn không phải file ảnh', true); return; }
      if(file.size > 10 * 1024 * 1024){ toast('Ảnh quá lớn — chọn ảnh dưới 10MB', true); return; }
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        const mx = 900, w0 = im.naturalWidth || mx, h0 = im.naturalHeight || mx;
        const sc = Math.min(1, mx / Math.max(w0, h0));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w0 * sc)); cv.height = Math.max(1, Math.round(h0 * sc));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cb(cv.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85), file.name);
      };
      im.onerror = () => { URL.revokeObjectURL(url); toast('Không đọc được file ảnh này', true); };
      im.src = url;
    }

    /* ================== SƠ ĐỒ BÀN ================== */
    let tableFilter = 'all';
    function rTables(){
      const zones = [...new Set(TABLES.map(t => t.zone))];
      const seg = [['all','Tất cả'],['free','Trống'],['busy','Có khách'],['waitpay','Chờ thanh toán']];
      let html = '<div class="toolbar"><div class="seg">' + seg.map(([k,l]) => '<button class="' + (tableFilter === k ? 'active' : '') + '" data-tf="' + k + '">' + l + '</button>').join('') + '</div>' +
        '<div class="legend" style="margin-left:auto"><span><i style="background:var(--green)"></i>Trống</span><span><i style="background:var(--brand)"></i>Đang phục vụ</span><span><i style="background:var(--amber)"></i>Chờ thanh toán</span></div></div>';
      zones.forEach(z => {
        const ts = TABLES.filter(t => t.zone === z && (tableFilter === 'all' || tableState(t).k === tableFilter || (tableFilter === 'busy' && tableState(t).k !== 'free')));
        if(!ts.length) return;
        html += '<div class="zone-title">' + z + '</div><div class="tables-grid">' + ts.map(t => {
          const st = tableState(t);
          const due = tableDue(t.id);
          const call = CALLS.find(c => c.table === t.id);
          return '<button class="table-card ' + st.k + '" data-table="' + t.id + '">' +
            (call ? '<span class="call-flag">Gọi nhân viên</span>' : '') +
            '<div class="tno">' + t.id.replace('B','Bàn ') + '</div>' +
            '<div class="meta">' + t.seats + ' chỗ · ' + t.zone + '</div>' +
            (due ? '<div class="amt">' + fmt(withVAT(due)) + '</div>' : '<div class="amt" style="color:var(--muted);font-weight:600;font-size:13.5px">Chưa có đơn</div>') +
            '<div class="st"><span class="chip ' + st.chip + '">' + st.label + '</span></div></button>';
        }).join('') + '</div>';
      });
      $('#view-ban').innerHTML = html || '<div class="panel" style="padding:30px;text-align:center;color:var(--muted)">Không có bàn nào ở trạng thái này.</div>';
      $$('#view-ban [data-tf]').forEach(b => b.addEventListener('click', () => { tableFilter = b.dataset.tf; rTables(); }));
      $$('#view-ban [data-table]').forEach(b => b.addEventListener('click', () => openTable(b.dataset.table)));
    }
    function openTable(tid){
      const t = TABLES.find(x => x.id === tid);
      const os = ordersOfTable(tid);
      const sub = tableDue(tid);
      const call = CALLS.find(c => c.table === tid);
      let body = '';
      if(call) body += '<div class="chip red" style="margin-bottom:12px">' + IC.bell.replace('class="ic"','width="14" height="14"') + '&nbsp;Khách đang gọi nhân viên (' + ago(call.at) + ' trước) — <button data-act="ack" style="font-weight:800;text-decoration:underline">Đã đến bàn</button></div><br>';
      if(!os.length){
        body += '<div class="g-empty" style="padding:26px 10px"><div class="big">Bàn đang trống</div><p style="margin:0">Khách quét mã QR tại bàn để gọi món, hoặc nhân viên tạo đơn tại quầy.</p></div>' +
          '<div style="display:grid;gap:9px"><button class="btn btn-brand" data-act="staff-add">Tạo đơn tại quầy</button><button class="btn btn-ghost" data-act="guest">Xem phía khách (QR)</button></div>';
      } else {
        body += os.map(o => {
          const st = orderStatus(o);
          return '<div style="margin-bottom:6px"><div style="display:flex;align-items:center;gap:9px"><b>' + o.id + '</b><span class="chip ' + st.chip + '">' + st.label + '</span><span style="margin-left:auto;font-size:12.5px;color:var(--muted)">' + timeStr(o.at) + ' · qua ' + o.src + '</span></div>' +
          o.items.map(it => { const m = menuById(it.mid); return '<div class="bill-line"><span class="q">' + it.qty + '×</span><span>' + esc(m.name) + (it.note ? ' <span style="color:var(--amber);font-weight:600">(' + esc(it.note) + ')</span>' : '') + '</span><span class="chip ' + (it.st === 'xong' ? 'green' : it.st === 'nau' ? 'blue' : 'red') + '">' + (it.st === 'xong' ? 'Đã ra' : it.st === 'nau' ? 'Đang nấu' : 'Chờ bếp') + '</span><span class="p">' + fmt(m.price * it.qty) + '</span></div>'; }).join('') + '</div>';
        }).join('') +
        '<div style="margin-top:12px"><div class="bill-sum"><span>Tạm tính</span><span>' + fmt(sub) + '</span></div>' +
        '<div class="bill-sum"><span>VAT 8%</span><span>' + fmt(withVAT(sub) - sub) + '</span></div>' +
        '<div class="bill-sum total"><span>Tổng thanh toán</span><span>' + fmt(withVAT(sub)) + '</span></div></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px"><button class="btn btn-ghost" data-act="staff-add">Thêm món</button><button class="btn btn-brand" data-act="pay">Thanh toán</button></div>';
      }
      openSheet('<div style="display:flex;align-items:center;gap:10px"><h3>' + tid.replace('B','Bàn ') + '</h3><span class="chip gray">' + t.seats + ' chỗ · ' + t.zone + '</span><button class="btn btn-ghost btn-sm" style="margin-left:auto" data-close="1">Đóng</button></div><div style="height:10px"></div>' + body);
      const q = s => $('#modalRoot ' + s);
      const ack = q('[data-act="ack"]'); if(ack) ack.addEventListener('click', () => { const i = CALLS.findIndex(c => c.table === tid); if(i >= 0) CALLS.splice(i,1); renderAll(); openTable(tid); toast('Đã ghi nhận — nhân viên đang đến ' + tid.replace('B','bàn ')); });
      const g = q('[data-act="guest"]'); if(g) g.addEventListener('click', () => { closeModal(); openGuest(tid); });
      const sa = q('[data-act="staff-add"]'); if(sa) sa.addEventListener('click', () => staffAddItems(tid));
      const pay = q('[data-act="pay"]'); if(pay) pay.addEventListener('click', () => openPay(tid));
    }

    /* ================== BẾP (KDS) ================== */
    function rKitchen(){
      const os = activeOrders().filter(o => o.items.some(i => i.st !== 'xong')).sort((a,b) => a.at - b.at);
      if(!os.length){
        $('#view-bep').innerHTML = kitchenSoundBar() + newOrderBanner() + '<div class="panel g-empty"><div style="display:flex;justify-content:center;color:var(--green)">' + IC.check.replace('<svg','<svg width="46" height="46"') + '</div><div class="big">Bếp đang trống</div><p style="margin:0">Chưa có món nào chờ nấu. Đơn mới từ khách quét QR sẽ hiện ngay tại đây.</p></div>';
        bindKitchenSoundBar(); bindNewOrderBanner();
        return;
      }
      $('#view-bep').innerHTML = kitchenSoundBar() + newOrderBanner() + '<div class="kitchen-grid">' + os.map(o => {
        const st = orderStatus(o);
        const mins = Math.round((Date.now() - o.at) / MIN);
        return '<div class="panel k-order' + (st.k === 'moi' ? ' new' : '') + (newOrderIds.has(o.id) ? ' just-new' : '') + '">' +
          '<div class="k-head"><span class="tno">' + o.table.replace('B','Bàn ') + '</span>' + (newOrderIds.has(o.id) ? '<span class="chip red">ĐƠN MỚI</span>' : '') + '<span class="chip ' + st.chip + '">' + st.label + '</span><span class="chip gray">' + o.id + ' · ' + o.src + '</span><time class="' + (mins >= 15 ? 'late' : '') + '">' + mins + '′</time></div>' +
          (o.note ? '<div style="padding:9px 15px 0;font-size:13px;color:var(--amber);font-weight:700">Ghi chú cả đơn: ' + esc(o.note) + '</div>' : '') +
          o.items.map((it, ix) => {
            const m = menuById(it.mid);
            let btn = '';
            if(it.st === 'cho') btn = '<button class="btn btn-brand btn-sm" data-k="' + o.id + ':' + ix + ':nau">Nhận nấu</button>';
            else if(it.st === 'nau') btn = '<button class="btn btn-green btn-sm" data-k="' + o.id + ':' + ix + ':xong">Ra món</button>';
            else btn = '<span class="chip green">Đã ra</span>';
            return '<div class="k-item' + (it.st === 'xong' ? ' done' : '') + '"><span class="qty">' + it.qty + '×</span><div class="nm"><b>' + esc(m.name) + '</b>' + (it.note ? '<span>' + esc(it.note) + '</span>' : '<span style="color:var(--muted);font-weight:500">Nấu ~' + m.time + ' phút</span>') + '</div>' + btn + '</div>';
          }).join('') + '</div>';
      }).join('') + '</div>';
      $$('#view-bep [data-k]').forEach(b => b.addEventListener('click', () => {
        const [oid, ix, ns] = b.dataset.k.split(':');
        const o = ORDERS.find(x => x.id === oid);
        const it = o.items[+ix];
        it.st = ns;
        if(ns === 'nau'){ newOrderIds.delete(o.id); if(newFlash && newFlash.oid === o.id){ newFlash = null; if(newFlashTimer){ clearTimeout(newFlashTimer); newFlashTimer = null; } } }
        if(ns === 'xong') feedPush('chef', 'green', 'Bếp báo xong: ' + menuById(it.mid).name + ' ×' + it.qty, 'Đơn ' + o.id + ' · ' + o.table.replace('B','Bàn '));
        renderAll();
      }));
      bindKitchenSoundBar(); bindNewOrderBanner();
    }

    /* ================== ĐƠN HÀNG ================== */
    let orderFilter = 'all';
    function rOrders(){
      const seg = [['all','Tất cả'],['moi','Mới'],['nau','Đang nấu'],['xong','Đã ra hết']];
      let list = activeOrders().sort((a,b) => b.at - a.at);
      if(orderFilter !== 'all') list = list.filter(o => orderStatus(o).k === orderFilter);
      const rows = list.map(o => {
        const st = orderStatus(o);
        const n = o.items.reduce((s,i) => s + i.qty, 0);
        return '<button class="order-row" data-ord="' + o.id + '"><div><div class="oid">' + o.id + ' · ' + o.table.replace('B','Bàn ') + '</div><div class="meta">' + timeStr(o.at) + ' · ' + ago(o.at) + ' trước · qua ' + o.src + ' · ' + n + ' món</div></div><span class="chip ' + st.chip + '">' + st.label + '</span><div class="amt">' + fmt(withVAT(orderTotal(o))) + '<span class="meta">đã gồm VAT</span></div></button>';
      }).join('');
      $('#view-don').innerHTML = '<div class="toolbar"><div class="seg">' + seg.map(([k,l]) => '<button class="' + (orderFilter === k ? 'active' : '') + '" data-of="' + k + '">' + l + '</button>').join('') + '</div></div>' +
        '<div class="panel">' + (rows || '<div class="g-empty"><div class="big">Không có đơn ở trạng thái này</div><p style="margin:0">Đơn mới sẽ xuất hiện tại đây ngay khi khách đặt.</p></div>') + '</div>';
      $$('#view-don [data-of]').forEach(b => b.addEventListener('click', () => { orderFilter = b.dataset.of; rOrders(); }));
      $$('#view-don [data-ord]').forEach(b => b.addEventListener('click', () => openTable(ORDERS.find(o => o.id === b.dataset.ord).table)));
    }

    /* ================== NHÂN VIÊN THÊM MÓN / TẠO ĐƠN ================== */
    function staffAddItems(tid){
      const avail = MENU.filter(m => !m.out);
      openSheet('<div style="display:flex;align-items:center;gap:10px"><h3>Thêm món · ' + tid.replace('B','Bàn ') + '</h3><button class="btn btn-ghost btn-sm" style="margin-left:auto" data-close="1">Đóng</button></div>' +
        '<p style="color:var(--muted);font-size:13.5px;margin:4px 0 12px">Chạm + để thêm món vào đơn của bàn. Món sẽ vào thẳng màn hình bếp.</p>' +
        '<div style="display:flex;flex-direction:column;gap:8px;max-height:46dvh;overflow-y:auto">' +
        avail.map(m => '<div style="display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 11px"><img src="' + dishImgSrc(m) + '" alt="" style="width:46px;height:46px;border-radius:9px;object-fit:cover"><div style="flex:1;min-width:0"><b style="font-size:14px">' + esc(m.name) + '</b><div style="font-size:13px;color:var(--brand-deep);font-weight:700">' + fmt(m.price) + '</div></div><span class="chip gray" data-cnt="' + m.id + '">0</span><button class="btn btn-brand btn-sm" data-add="' + m.id + '">+ Thêm</button></div>').join('') +
        '</div><button class="btn btn-brand" style="width:100%;margin-top:14px" id="staffConfirm">Gửi bếp</button>');
      const picked = {};
      $$('#modalRoot [data-add]').forEach(b => b.addEventListener('click', () => {
        picked[b.dataset.add] = (picked[b.dataset.add] || 0) + 1;
        $('#modalRoot [data-cnt="' + b.dataset.add + '"]').textContent = picked[b.dataset.add];
      }));
      $('#staffConfirm').addEventListener('click', () => {
        const entries = Object.entries(picked).filter(([,q]) => q > 0);
        if(!entries.length){ toast('Chưa chọn món nào', true); return; }
        let o = ordersOfTable(tid).slice(-1)[0];
        if(!o){ o = {id:'DH' + (orderSeq++), table:tid, src:'Tại quầy', at:Date.now(), note:'', paid:false, items:[]}; ORDERS.push(o); }
        entries.forEach(([mid, q]) => { o.items.push({mid, qty:q, note:'', st:'cho'}); const m = menuById(mid); m.sold += q; });
        feedPush('receipt', 'brand', 'Đơn ' + o.id + ' · ' + tid.replace('B','Bàn ') + ' thêm món', 'Nhân viên tạo tại quầy');
        closeModal(); renderAll(); openTable(tid);
        toast('Đã gửi ' + entries.reduce((s,[,q]) => s + q, 0) + ' món vào bếp');
      });
    }

    /* ================== THANH TOÁN + HÓA ĐƠN ================== */
    let payMethod = 'Chuyển khoản', cashGiven = 0;
    function openPay(tid){
      const os = ordersOfTable(tid);
      const sub = tableDue(tid), total = withVAT(sub);
      payMethod = 'Chuyển khoản'; cashGiven = 0;
      const methods = [['Tiền mặt','money'],['Chuyển khoản','qr'],['Thẻ','wallet']];
      openSheet('<div style="display:flex;align-items:center;gap:10px;position:sticky;top:-20px;background:var(--bg);z-index:6;padding:10px 0 8px;margin-top:-10px"><h3>Thanh toán · ' + tid.replace('B','Bàn ') + '</h3><button class="btn btn-ghost btn-sm" style="margin-left:auto" data-close="1">Đóng</button></div>' +
        '<div style="height:8px"></div>' +
        os.map(o => o.items.map(it => { const m = menuById(it.mid); return '<div class="bill-line"><span class="q">' + it.qty + '×</span><span>' + esc(m.name) + '</span><span class="p">' + fmt(m.price * it.qty) + '</span></div>'; }).join('')).join('') +
        '<div class="bill-sum" style="margin-top:8px"><span>Tạm tính</span><span>' + fmt(sub) + '</span></div>' +
        '<div class="bill-sum"><span>VAT 8%</span><span>' + fmt(total - sub) + '</span></div>' +
        '<div class="bill-sum total"><span>Tổng thanh toán</span><span>' + fmt(total) + '</span></div>' +
        '<div class="field" style="margin-top:14px"><label>Hình thức thanh toán</label><div class="pay-methods">' +
        methods.map(([m, ic]) => '<button data-pm="' + m + '" class="' + (m === payMethod ? 'active' : '') + '">' + IC[ic] + m + '</button>').join('') + '</div></div>' +
        '<div class="field hidden" id="cashField"><label>Khách đưa (đ)</label><input id="cashIn" type="number" inputmode="numeric" placeholder="Ví dụ: 500000"><div id="cashBack" style="margin-top:7px;font-weight:700;color:var(--green)"></div></div>' +
        '<div id="qrPayBox" style="text-align:center;padding:6px 0 4px"><div class="qr-box" id="payQr" style="margin:0 auto"></div><div style="font-size:12.5px;color:var(--muted)">Quét để chuyển khoản đúng số tiền ' + fmt(total) + '</div></div>' +
        '<div class="sheet-actions"><button class="btn btn-brand" style="width:100%" id="payConfirm">Xác nhận đã thu ' + fmt(total) + '</button>' +
        '<button class="btn btn-ghost" style="width:100%;margin-top:9px" data-close="1">Đóng · chưa thu tiền</button></div>');
      drawPayQR(total);
      const syncMethod = () => {
        $$('#modalRoot [data-pm]').forEach(b => b.classList.toggle('active', b.dataset.pm === payMethod));
        $('#cashField').classList.toggle('hidden', payMethod !== 'Tiền mặt');
        $('#qrPayBox').classList.toggle('hidden', payMethod !== 'Chuyển khoản');
      };
      $$('#modalRoot [data-pm]').forEach(b => b.addEventListener('click', () => { payMethod = b.dataset.pm; syncMethod(); }));
      $('#cashIn').addEventListener('input', e => {
        cashGiven = +e.target.value || 0;
        $('#cashBack').textContent = cashGiven >= total ? 'Tiền thừa trả khách: ' + fmt(cashGiven - total) : (cashGiven ? 'Còn thiếu ' + fmt(total - cashGiven) : '');
      });
      syncMethod();
      $('#payConfirm').addEventListener('click', () => {
        if(payMethod === 'Tiền mặt' && cashGiven && cashGiven < total){ toast('Khách đưa chưa đủ tiền', true); return; }
        finishPay(tid, os, sub, total);
      });
    }
    function drawPayQR(total){
      const el = $('#payQr'); if(!el) return;
      const txt = 'Thanh toan ' + SHOP.name + ' - so tien ' + total + ' VND';
      if(window.QRCode){ el.innerHTML = ''; new QRCode(el, {text: txt, width: 132, height: 132, correctLevel: QRCode.CorrectLevel.M}); }
      else el.innerHTML = '<span style="font-size:12px;color:#857463;padding:10px;text-align:center">QR chuyển khoản<br>' + fmt(total) + '</span>';
    }
    function finishPay(tid, os, sub, total){
      const bill = {id:'HD' + (billSeq++), table:tid, at:Date.now(), total, method:payMethod};
      BILLS.push(bill);
      os.forEach(o => o.paid = true);
      const tb = TABLES.find(t => t.id === tid); if(tb) tb.billReq = false;
      const ci = CALLS.findIndex(c => c.table === tid); if(ci >= 0) CALLS.splice(ci, 1);
      feedPush('money', 'green', 'Thu ' + fmt(total) + ' · ' + tid.replace('B','Bàn '), payMethod + ' · ' + bill.id);
      renderAll();
      showReceipt(bill, os, sub, total);
    }
    function showReceipt(bill, os, sub, total){
      const tid = bill.table;
      const lines = os.map(o => o.items.map(it => { const m = menuById(it.mid); return '<div class="bill-line" style="border-color:#E7DAC6"><span class="q">' + it.qty + '×</span><span>' + esc(m.name) + '</span><span class="p">' + fmt(m.price * it.qty) + '</span></div>'; }).join('')).join('');
      openSheet('<div class="receipt"><div class="rc-head">' + (SHOP.logo ? '<img src="' + SHOP.logo + '" alt="Logo ' + esc(SHOP.name) + '" style="width:58px;height:58px;object-fit:contain;margin:0 auto 6px">' : '') + '<b>' + esc(SHOP.name) + '</b><div>' + esc(SHOP.address) + ' · ' + esc(SHOP.phone) + '</div><div style="margin-top:6px;font-weight:700">HÓA ĐƠN THANH TOÁN · ' + bill.id + '</div><div>' + tid.replace('B','Bàn ') + ' · ' + timeStr(bill.at) + ' · ' + new Date(bill.at).toLocaleDateString('vi-VN') + '</div></div>' +
        lines +
        '<div class="bill-sum" style="margin-top:8px"><span>Tạm tính</span><span>' + fmt(sub) + '</span></div>' +
        '<div class="bill-sum"><span>VAT 8%</span><span>' + fmt(total - sub) + '</span></div>' +
        '<div class="bill-sum total" style="border-color:#241A12"><span>TỔNG CỘNG</span><span>' + fmt(total) + '</span></div>' +
        '<div class="bill-sum"><span>Hình thức</span><span>' + bill.method + (bill.method === 'Tiền mặt' && cashGiven ? ' · khách đưa ' + fmt(cashGiven) + ' · thừa ' + fmt(cashGiven - total) : '') + '</span></div>' +
        '<div style="text-align:center;margin-top:14px;color:#857463">Cảm ơn anh/chị đã ghé ' + esc(SHOP.name) + '!<br>Hẹn gặp lại lần sau.</div></div>' +
        '<div class="sheet-actions">' +
          '<div class="paper-row"><span class="lbl">' + IC.printer.replace('class="ic"','width="16" height="16"') + ' In phiếu máy POS · khổ giấy</span><div class="seg"><button data-paper="80"' + (posPaper === 80 ? ' class="active"' : '') + '>80mm</button><button data-paper="58"' + (posPaper === 58 ? ' class="active"' : '') + '>58mm</button></div></div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button class="btn btn-ghost" id="dlBill">Tải hóa đơn (.txt)</button><button class="btn btn-ghost" id="posBtn">' + IC.printer.replace('class="ic"','width="16" height="16"') + ' In phiếu POS</button></div>' +
          '<button class="btn btn-brand" id="finishBtn" style="width:100%;margin-top:9px">Hoàn tất · đóng bàn</button>' +
        '</div>');
      fillPOS(bill, os, sub, total);
      $('#dlBill').addEventListener('click', () => downloadBill(bill, os, sub, total));
      $('#posBtn').addEventListener('click', () => showPOS(bill, os, sub, total));
      $$('#modalRoot [data-paper]').forEach(b => b.addEventListener('click', () => { posPaper = +b.dataset.paper; $$('#modalRoot [data-paper]').forEach(x => x.classList.toggle('active', x === b)); fillPOS(bill, os, sub, total); }));
      $('#finishBtn').addEventListener('click', () => { closeModal(); toast('Đã đóng ' + tid.replace('B','Bàn ') + ' · bàn trống, sẵn sàng đón khách'); });
    }
    let posPaper = 80; // khổ giấy máy in POS: 80mm hoặc 58mm
    function posReceiptHTML(bill, os, sub, total, screen){
      const rows = os.map(o => o.items.map(it => { const m = menuById(it.mid); return '<div class="pr"><span>' + it.qty + ' x ' + esc(m.name) + '</span><span>' + fmt(m.price * it.qty) + '</span></div>' + (it.note ? '<div class="pn">(' + esc(it.note) + ')</div>' : ''); }).join('')).join('');
      return '<div class="pos' + (posPaper === 58 ? ' w58' : '') + (screen ? ' pos-screen' : '') + '" style="width:' + (posPaper === 58 ? '48mm' : '72mm') + '">' +
          (SHOP.logo ? '<div class="pc"><img src="' + SHOP.logo + '" alt="Logo ' + esc(SHOP.name) + '" style="width:' + (posPaper === 58 ? '24mm' : '30mm') + ';max-height:' + (posPaper === 58 ? '24mm' : '30mm') + ';object-fit:contain"></div>' : '') +
          '<div class="pc shop">' + esc(SHOP.name.toUpperCase()) + '</div>' +
          '<div class="pc">' + esc(SHOP.address) + '</div>' +
          '<div class="pc">ĐT: ' + esc(SHOP.phone) + '</div>' +
          '<div class="phr"></div>' +
          '<div class="pc ttl">HÓA ĐƠN THANH TOÁN</div>' +
          '<div class="pr"><span>Số: ' + bill.id + '</span><span>' + bill.table.replace('B','Bàn ') + '</span></div>' +
          '<div class="pr"><span>' + timeStr(bill.at) + '</span><span>' + new Date(bill.at).toLocaleDateString('vi-VN') + '</span></div>' +
          '<div class="phr"></div>' +
          rows +
          '<div class="phr"></div>' +
          '<div class="pr"><span>Tạm tính</span><span>' + fmt(sub) + '</span></div>' +
          '<div class="pr"><span>VAT 8%</span><span>' + fmt(total - sub) + '</span></div>' +
          '<div class="pr tot"><span>TỔNG CỘNG</span><span>' + fmt(total) + '</span></div>' +
          '<div class="pr"><span>Hình thức</span><span>' + bill.method + '</span></div>' +
          (bill.method === 'Tiền mặt' && cashGiven ? '<div class="pr"><span>Khách đưa</span><span>' + fmt(cashGiven) + '</span></div><div class="pr"><span>Tiền thừa</span><span>' + fmt(cashGiven - total) + '</span></div>' : '') +
          '<div class="phr"></div>' +
          '<div class="pc">Cảm ơn anh/chị đã ghé ' + esc(SHOP.name) + '!</div>' +
          '<div class="pc">Hẹn gặp lại lần sau.</div>' +
        '</div>';
    }
    function fillPOS(bill, os, sub, total){
      $('#posArea').innerHTML = posReceiptHTML(bill, os, sub, total, false);
      $('#pageRule').textContent = '@media print{@page{size:' + posPaper + 'mm auto;margin:0}}';
    }
    function showPOS(bill, os, sub, total){
      fillPOS(bill, os, sub, total);
      openSheet('<div style="display:flex;align-items:center;gap:10px"><h3>Phiếu in máy POS · ' + bill.id + '</h3><button class="btn btn-ghost btn-sm" style="margin-left:auto" data-close="1">Đóng</button></div>' +
        '<p style="color:var(--muted);font-size:13.5px;margin:4px 0 0">Phiếu khổ nhiệt đúng nội dung sẽ ra từ máy in POS của quán.</p>' +
        '<div style="background:var(--surface2);border-radius:14px;padding:16px 8px;margin-top:12px;overflow-x:auto">' + posReceiptHTML(bill, os, sub, total, true) + '</div>' +
        '<p style="font-size:12.5px;color:var(--muted);margin-top:12px">Bấm <b>In ngay</b> (hoặc Ctrl+P trên máy tính) rồi chọn máy in POS của quán — bản in chỉ gồm phiếu này, đúng khổ giấy đã chọn, không kèm phần còn lại của trang.</p>' +
        '<div class="sheet-actions">' +
          '<div class="paper-row"><span class="lbl">' + IC.printer.replace('class="ic"','width="16" height="16"') + ' Khổ giấy</span><div class="seg"><button data-paper="80"' + (posPaper === 80 ? ' class="active"' : '') + '>80mm</button><button data-paper="58"' + (posPaper === 58 ? ' class="active"' : '') + '>58mm</button></div></div>' +
          '<button class="btn btn-brand" id="printPos" style="width:100%">' + IC.printer.replace('class="ic"','width="16" height="16"') + ' In ngay ra máy POS</button>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px"><button class="btn btn-ghost" id="dlPos">Tải phiếu (.txt)</button><button class="btn btn-ghost" id="backBill">Quay lại hóa đơn</button></div>' +
        '</div>');
      $$('#modalRoot [data-paper]').forEach(b => b.addEventListener('click', () => { posPaper = +b.dataset.paper; showPOS(bill, os, sub, total); }));
      $('#printPos').addEventListener('click', () => { fillPOS(bill, os, sub, total); window.print(); });
      $('#dlPos').addEventListener('click', () => downloadBill(bill, os, sub, total));
      $('#backBill').addEventListener('click', () => showReceipt(bill, os, sub, total));
    }
    function downloadBill(bill, os, sub, total){
      const rows = os.flatMap(o => o.items.map(it => { const m = menuById(it.mid); return '  ' + it.qty + ' x ' + m.name.padEnd(28, ' ') + fmt(m.price * it.qty); }));
      const txt = [SHOP.name.toUpperCase(), SHOP.address + ' · ' + SHOP.phone, '----------------------------------------',
        'Hóa đơn: ' + bill.id + ' · ' + bill.table.replace('B','Bàn ') + ' · ' + timeStr(bill.at) + ' ' + new Date(bill.at).toLocaleDateString('vi-VN'), '',
        ...rows, '----------------------------------------',
        'Tạm tính: ' + fmt(sub), 'VAT 8%: ' + fmt(total - sub), 'TỔNG CỘNG: ' + fmt(total), 'Hình thức: ' + bill.method, '',
        'Cảm ơn anh/chị đã ghé ' + SHOP.name + '!'].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain;charset=utf-8'}));
      a.download = 'hoa-don-' + bill.id + '.txt';
      a.click(); URL.revokeObjectURL(a.href);
    }

    /* ================== QUẢN LÝ THỰC ĐƠN ================== */
    let adminCat = 'Tất cả';
    function rMenuAdmin(){

      let list = MENU.filter(m => adminCat === 'Tất cả' || m.cat === adminCat);
      $('#view-thucdon').innerHTML =
        '<div class="toolbar"><div class="seg">' + cats.map(c => '<button class="' + (adminCat === c ? 'active' : '') + '" data-ac="' + c + '">' + c + '</button>').join('') + '</div>' +
        '<button class="btn btn-brand btn-sm" style="margin-left:auto" id="addDish">' + IC.plus.replace('class="ic"','width="16" height="16"') + ' Thêm món mới</button></div>' +
        '<div class="menu-admin">' + list.map(m =>
          '<div class="panel ma-card"><img src="' + dishImgSrc(m) + '" alt="' + esc(m.name) + '"><div class="inf">' +
            '<div class="nm">' + esc(m.name) + (m.out ? ' <span class="chip red">Đang hết</span>' : '') + '</div>' +

        '<div class="field"><label>Danh mục</label><select id="fCat">' + CATS.map(c => '<option' + (m.cat === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +

            '</div>' +

        '</div>' +

        '<button class="btn btn-brand" style="width:100%" id="fSave">' + (isNew ? 'Thêm vào thực đơn' : 'Lưu thay đổi') + '</button>');
      const prev = $('#fImgPreview'), sel = $('#fImg'), fileIn = $('#fImgFile'), hint = $('#fImgHint'), pick = $('#fImgPick');
      const setPreview = () => { prev.src = pendingImg.indexOf('data:') === 0 ? pendingImg : 'assets/' + pendingImg; };
      sel.addEventListener('change', () => {

        pendingImg = sel.value; setPreview();
        hint.textContent = 'Đang dùng ảnh mẫu “' + sel.value.replace('.jpg','') + '”. Bấm Tải ảnh nếu muốn dùng ảnh chụp thật của quán.';

      $('#fImgBtn').addEventListener('click', () => fileIn.click());
      const applyFile = file => {

          pendingImg = dataUrl;
          if(!sel.querySelector('option[value="__custom"]')){
            const o = document.createElement('option'); o.value = '__custom'; o.textContent = 'Ảnh đã tải lên (đang dùng)'; sel.insertBefore(o, sel.firstChild);

      fileIn.addEventListener('change', () => { if(fileIn.files && fileIn.files[0]) applyFile(fileIn.files[0]); fileIn.value = ''; });
      ['dragover','dragenter'].forEach(ev => pick.addEventListener(ev, e => { e.preventDefault(); pick.classList.add('drag'); }));
      ['dragleave','drop'].forEach(ev => pick.addEventListener(ev, e => { e.preventDefault(); pick.classList.remove('drag'); }));
      pick.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) applyFile(f); });

        closeModal(); rMenuAdmin();
      });

    /* ================== THIẾT LẬP BÀN & QR BÀN ================== */
    function downloadQR(box, tid){
      const cv = box && box.querySelector('canvas');
      const im = box && box.querySelector('img');
      const a = document.createElement('a');
      a.download = 'QR-' + tid + '.png';
      if(cv) a.href = cv.toDataURL('image/png');
      else if(im && im.src) a.href = im.src;
      else { toast('Mã QR chưa tải xong, thử lại sau giây lát', true); return; }
      a.click(); toast('Đã tải mã QR ' + tid.replace('B','bàn '));
    }
    function printQRCard(tid){
      const src = $('#view-thietlap [data-qrbox="' + tid + '"]');
      const t = TABLES.find(x => x.id === tid);
      const cv = src && src.querySelector('canvas');
      const im = src && src.querySelector('img');
      let srcUrl = '';
      if(cv) srcUrl = cv.toDataURL('image/png');
      else if(im && im.src) srcUrl = im.src;

      $('#qrPrintArea').innerHTML =
        '<div style="text-align:center;font-family:\'Be Vietnam Pro\',sans-serif;color:#000;padding:6mm 4mm">' +
          (SHOP.logo ? '<img src="' + SHOP.logo + '" alt="Logo ' + esc(SHOP.name) + '" style="width:15mm;height:15mm;object-fit:contain;margin:0 auto 2mm;display:block">' : '') +

          '<div style="font-size:12.5px;margin-top:2px">Quét mã bằng camera điện thoại để xem thực đơn &amp; gọi món ngay tại bàn</div>' +
          '<img src="' + srcUrl + '" alt="Mã QR ' + tid.replace('B','Bàn ') + '" style="width:52mm;height:52mm;margin:5mm auto;display:block">' +
          '<div style="font-size:21px;font-weight:800">' + tid.replace('B','Bàn ') + '</div>' +
          '<div style="font-size:12.5px">' + t.seats + ' chỗ · ' + esc(t.zone) + '</div>' +
        '</div>';
      document.body.classList.add('qr-printing');
      $('#pageRule').textContent = '@media print{@page{size:auto;margin:8mm} body.qr-printing>*:not(#qrPrintArea){display:none !important} body.qr-printing #posArea{display:none !important} body.qr-printing #qrPrintArea{display:block !important}}';
      const cleanup = () => { document.body.classList.remove('qr-printing'); window.removeEventListener('afterprint', cleanup); };
      window.addEventListener('afterprint', cleanup);
      setTimeout(cleanup, 30000);
      window.print();
    }

    function tableForm(t){
      const isNew = !t;
      const zones = [...new Set(TABLES.map(x => x.zone))];
      let suggest = 'B' + String(tableSeq).padStart(2, '0');
      while(TABLES.some(x => x.id === suggest)){ tableSeq++; suggest = 'B' + String(tableSeq).padStart(2, '0'); }
      t = t || {id: suggest, seats: 4, zone: zones[0] || 'Tầng trệt'};
      openSheet('<div style="display:flex;align-items:center;gap:10px"><h3>' + (isNew ? 'Thêm bàn mới' : 'Sửa ' + t.id.replace('B','Bàn ')) + '</h3><button class="btn btn-ghost btn-sm" style="margin-left:auto" data-close="1">Đóng</button></div><div style="height:10px"></div>' +
        '<div class="field"><label>Mã bàn</label><input id="tId" value="' + esc(t.id) + '"' + (isNew ? '' : ' disabled') + ' placeholder="Ví dụ: B13">' +
        (isNew
          ? '<div style="font-size:12.5px;color:var(--muted);margin-top:5px">Mã bàn dùng trong link QR (…#ban=' + esc(t.id) + '). Chỉ gồm chữ và số, không trùng bàn khác.</div>'
          : '<div style="font-size:12.5px;color:var(--muted);margin-top:5px">Mã bàn cố định để thẻ QR đã in không bị sai. Muốn đổi mã: xóa bàn khi đang trống rồi tạo lại.</div>') + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">' +
          '<div class="field"><label>Số ghế</label><input id="tSeats" type="number" inputmode="numeric" min="1" max="30" value="' + t.seats + '"></div>' +
          '<div class="field"><label>Khu vực</label><input id="tZone" list="zoneList" value="' + esc(t.zone) + '" placeholder="Chọn hoặc gõ khu vực mới"><datalist id="zoneList">' + zones.map(z => '<option value="' + esc(z) + '">').join('') + '</datalist></div>' +
        '</div>' +
        '<div class="sheet-actions"><button class="btn btn-brand" style="width:100%" id="tSave">' + (isNew ? 'Tạo bàn & mã QR' : 'Lưu thay đổi') + '</button></div>');
      $('#tSave').addEventListener('click', () => {
        const seats = Math.min(30, Math.max(1, +$('#tSeats').value || 0));
        const zone = $('#tZone').value.trim();
        if(!seats){ toast('Nhập số ghế hợp lệ (1–30)', true); return; }
        if(!zone){ toast('Chọn hoặc nhập khu vực cho bàn', true); return; }
        if(isNew){
          const id = $('#tId').value.trim().toUpperCase().replace(/\s+/g, '');
          if(!/^[A-Z0-9]{2,6}$/.test(id)){ toast('Mã bàn gồm 2–6 ký tự chữ/số, ví dụ B13', true); return; }
          if(TABLES.some(x => x.id === id)){ toast('Mã ' + id + ' đã có — chọn mã khác', true); return; }
          TABLES.push({id, seats, zone});
          const n = parseInt(id.replace(/\D/g, ''), 10);
          if(!isNaN(n) && n >= tableSeq) tableSeq = n + 1;
          closeModal(); renderAll();
          toast('Đã thêm ' + id.replace('B','Bàn ') + ' · ' + seats + ' chỗ · ' + zone + ' — mã QR đã sẵn sàng để tải / in');
        } else {
          t.seats = seats; t.zone = zone;
          closeModal(); renderAll();
          toast('Đã cập nhật ' + t.id.replace('B','Bàn ') + ' · ' + seats + ' chỗ · ' + zone);
        }
      });
    }

        '<div class="panel" style="padding:18px;max-width:640px">' +
